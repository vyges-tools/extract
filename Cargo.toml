[package]
name = "vyges-extract"
version = "0.1.0"
edition = "2021"
description = "Interconnect RC parasitic extraction: routed layout in, SPEF out."
license = "Apache-2.0"
authors = ["Vyges <https://vyges.com/contact>"]
homepage = "https://vyges.com"
repository = "https://github.com/vyges-tools/extract"

# No third-party deps (builds/tests offline). Shared readers come from the
# vyges-loom foundation — sibling-checkout path dep in dev; release pins git/version.
# vyges-layout supplies the GDS reader + geometry primitives for the optional
# `gds -> DefNet` connectivity-tracing front-end (a GDS-only analog flow); the RC
# core still consumes `&[DefNet]` only, so this stays above the rc.rs boundary.
[dependencies]
vyges-loom = { git = "https://github.com/vyges-tools/loom", tag = "v0.1.0" }
vyges-layout = { git = "https://github.com/vyges-tools/layout", tag = "v0.1.0" }

[[bin]]
name = "vyges-extract"
path = "src/main.rs"

[lib]
name = "vyges_extract"
path = "src/lib.rs"
